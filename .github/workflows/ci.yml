on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      JWT_SECRET: ${{ d27d606eee1f2b961ee1fb0ef899691f03e15ecd1aac1af327967af1c053fd785b2e0a8b822a4597f836f70d7bf9830a }}
      DATABASE_URL: ${{postgresql://postgres:Madinas@11223@db.swjeoygoqadwbsfpahuq.supabase.co:5432/postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint (allow failures)
        run: npm run lint || true

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
