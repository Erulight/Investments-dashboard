on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  migrate-and-seed:
    name: Deploy Prisma schema and run seed (Supabase)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # --- DEBUG STEP: network & connectivity checks (bash-only) ---
      - name: Debug - check DNS and TCP connectivity to DB host
        run: |
          echo "Parsing DATABASE_URL for debug (secrets are masked in logs)..."
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is EMPTY"
            exit 0
          fi

          # Extract host, port, user, db using sed (works for standard postgres URI)
          HOST=$(echo "$DATABASE_URL" | sed -E 's#^[^@]*@([^:/?]+).*#\1#')
          PORT=$(echo "$DATABASE_URL" | sed -E 's#^[^:]+://[^@]*@[^:]+:([0-9]+)/.*#\1#' || echo "")
          if [ -z "$PORT" ]; then PORT=5432; fi
          USER=$(echo "$DATABASE_URL" | sed -E 's#^[^:]+://([^:]+):.*@.*#\1#' || true)
          DBNAME=$(echo "$DATABASE_URL" | sed -E 's#.*/([^/?]+)(\\?.*)?$#\1#' || echo "postgres")

          echo "Host: $HOST"
          echo "Port: $PORT"
          echo "User: ${USER:-<none>}"
          echo "DB: ${DBNAME:-<none>}"
          echo

          echo "Resolving DNS for host..."
          if command -v getent >/dev/null 2>&1; then
            getent hosts "$HOST" || echo "getent failed"
          else
            nslookup "$HOST" || host "$HOST" || echo "DNS lookup tools unavailable"
          fi
          echo

          echo "Installing debug tools (netcat, psql)..."
          sudo apt-get update -y
          sudo apt-get install -y netcat postgresql-client || true
          echo

          if [ -n "$HOST" ]; then
            echo "Testing TCP connect to $HOST:$PORT (may timeout if blocked)..."
            nc -vz "$HOST" "$PORT" || true
          else
            echo "Host empty - skipping TCP test"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Debug - attempt psql listing (will be masked)
        if: always()
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not set - skipping psql test"
            exit 0
          fi

          # Extract password, host, db (simple extraction; secrets are masked)
          PGPASS=$(echo "$DATABASE_URL" | sed -E 's#^[^:]+://[^:]+:([^@]+)@.*#\1#' || echo "")
          HOST=$(echo "$DATABASE_URL" | sed -E 's#^[^@]*@([^:/?]+).*#\1#')
          DB=$(echo "$DATABASE_URL" | sed -E 's#.*/([^/?]+)(\\?.*)?$#\1#' || echo "postgres")

          if [ -z "$HOST" ]; then
            echo "No host parsed - skipping psql"
            exit 0
          fi

          echo "Will attempt psql to host=$HOST db=$DB (password masked)"
          # Try connecting with sslmode=require (Supabase needs SSL)
          PGPASSWORD="$PGPASS" psql "postgresql://postgres@$HOST:5432/$DB?sslmode=require" -c "\l" || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # --- End debug steps ---

      - name: Run lint (allow failures)
        run: npm run lint || true

      - name: Ensure DATABASE_URL is available (sanity)
        run: echo "DATABASE_URL is set"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Push schema to database
        run: npx prisma db push --schema=prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run seed script
        run: npm run prisma:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Confirm done
        run: echo "Migrations and seed completed."
