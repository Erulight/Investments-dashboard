version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: investments
      POSTGRES_PASSWORD: investments_password
      POSTGRES_DB: investments_dashboard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://investments:investments_password@db:5432/investments_dashboard?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && npm run prisma:seed && node server.js"

volumes:
  postgres_data:
